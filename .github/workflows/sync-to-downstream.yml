name: Sync Definitions to Downstream

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "raw_column_definition_GAM.md"
      - ".github/sync-biztrends.yml"
      - ".github/workflows/sync-to-downstream.yml"

concurrency:
  group: sync-downstream
  cancel-in-progress: true

jobs:
  sync-to-downstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Money biztrends.TW
        uses: BetaHuhn/repo-file-sync-action@latest
        with:
          GH_PAT: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY }}
          CONFIG_PATH: .github/sync-biztrends.yml
          COMMIT_EACH_FILE: false
          PR_LABELS: "automated-sync"
          SKIP_PR: true
