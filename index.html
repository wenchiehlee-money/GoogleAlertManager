<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>GoogleAlertManager 股票分析儀表板</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="自動化股票分析與 Google Alerts 管理系統">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Favicon (破曉警報鳥) -->
  <link rel="icon" type="image/svg+xml" href="falcon-favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="falcon-favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <!-- Global site tag (gtag.js) - Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-913Z6DSVD2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-913Z6DSVD2');
  </script>
  <!-- 使用現代化的主題與專屬 SaaS Signal Intelligence 設計系統 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="gam-theme.css">
</head>
<body>
  <!-- 破曉警報鳥 (Alert Bird) SVG Symbol 定義 (Lucide 官方原生) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="icon-falcon-radar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 7h.01" />
      <path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20" />
      <path d="m20 7 2 .5-2 .5" />
      <path d="M10 18v3" />
      <path d="M14 17.75V21" />
      <path d="M7 18a6 6 0 0 0 3.84-10.61" />
    </symbol>
  </svg>

  <!-- 常駐頂部品牌欄 (Brand Bar) 與跨專案導航鈕 -->
  <header id="gam-brand-bar" class="gam-brand-bar">
    <a href="#/" class="gam-brand-badge" title="回到首頁">
      <div class="gam-mascot-glow">
        <svg class="gam-falcon-icon"><use href="#icon-falcon-radar"/></svg>
      </div>
      <div class="gam-brand-text">
        <span class="gam-brand-title">GoogleAlertManager</span>
        <span class="gam-brand-sub">SaaS Signal Intelligence · 破曉警報鳥 🐦</span>
      </div>
    </a>
    <div class="gam-top-nav">
      <a href="https://wenchiehlee-money.github.io/UX-Deck/" class="gam-nav-pill" title="回到主題首頁">
        <span class="gam-nav-icon">🏠</span> 主題首頁
      </a>
      <a href="https://github.com/wenchiehlee-money/GoogleAlertManager" target="_blank" rel="noopener noreferrer" class="gam-nav-pill gam-nav-pill-github" title="前往 GitHub 儲存庫">
        <span class="gam-nav-icon">📦</span> GitHub 儲存庫
      </a>
    </div>
  </header>

  <div id="app">🚀 正在載入分析數據...</div>
  <script src="paths.js"></script>
  <script>
    // 檢查 paths.js 是否有更新，若有更新則清除 Docsify 搜尋快取以重新建立索引
    try {
      const localKey = 'docsify.search.timestamp';
      const currentTimestamp = window.DOCS_PATHS_TIMESTAMP;
      if (currentTimestamp) {
        const cachedTimestamp = localStorage.getItem(localKey);
        if (cachedTimestamp !== String(currentTimestamp)) {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const key = localStorage.key(i);
            if (key && (key.startsWith('docsify.search') || key.includes('docsify.search'))) {
              try { localStorage.removeItem(key); } catch (e) {}
            }
          }
          try { localStorage.setItem(localKey, currentTimestamp); } catch (e) {}
        }
      }
    } catch (e) {
      console.warn('Failed to clear docsify search cache:', e);
    }
  </script>
  <script>
    window.$docsify = {
      name: 'GoogleAlertManager',
      repo: 'wenchiehlee-money/GoogleAlertManager',
      corner: false,
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      homepage: 'README.md',
      auto2top: true,
      formatUpdated: '{MM}/{DD} {HH}:{mm}',
      executeScript: true,
      search: {
        maxAge: 86400000,
        paths: (window.DOCS_PATHS && window.DOCS_PATHS.length > 0) ? window.DOCS_PATHS : 'auto',
        placeholder: '搜尋文章或報告...',
        noData: '找不到符合的文章',
        depth: 6,
        hideOtherSidebarContent: false
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            // 派發 GA4 page_view 事件（配合 SPA Hash 路由）
            if (typeof gtag === 'function') {
              gtag('event', 'page_view', {
                page_title: document.title,
                page_location: window.location.href,
                page_path: window.location.pathname + window.location.hash
              });
            }
            // 自動為利多/利空分析區塊套用 Callout 高亮容器
            const headings = document.querySelectorAll('.markdown-section h3');
            headings.forEach(function(h3) {
              const text = h3.innerText || '';
              if (text.includes('利多因素')) {
                let next = h3.nextElementSibling;
                if (next && next.tagName === 'UL') {
                  next.classList.add('gam-callout', 'gam-callout-bullish');
                }
              } else if (text.includes('利空因素')) {
                let next = h3.nextElementSibling;
                if (next && next.tagName === 'UL') {
                  next.classList.add('gam-callout', 'gam-callout-bearish');
                }
              } else if (text.includes('整體傾向')) {
                let next = h3.nextElementSibling;
                if (next && (next.tagName === 'P' || next.tagName === 'UL')) {
                  next.classList.add('gam-callout', 'gam-callout-neutral');
                }
              }
            });
          });
        }
      ]
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- 全域搜尋外掛 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
