<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>GoogleAlertManager 股票分析儀表板</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="自動化股票分析與 Google Alerts 管理系統">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- 使用現代化的主題 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2c3e50;
    }
    .markdown-section {
      max-width: 95%;
      margin: 0 auto;
      padding: 30px;
    }
    /* 優化表格顯示 */
    table {
      display: table !important;
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }
    th {
      background-color: #f8f9fa;
    }
    /* 連結顏色 */
    section.markdown-section a {
      color: #3498db;
      font-weight: 600;
      text-decoration: none;
    }
    section.markdown-section a:hover {
      text-decoration: underline;
    }
    /* 側邊欄樣式 */
    .sidebar {
      background-color: #fff;
    }
    /* 搜尋框優化，使其更加顯眼 */
    .search {
      margin-bottom: 15px;
      padding: 15px 15px 0 15px;
    }
    .search input {
      padding: 10px 15px 10px 30px !important;
      font-size: 14px !important;
      border: 2px solid #3498db !important; /* 醒目的藍色外框 */
      border-radius: 20px !important;       /* 圓角樣式 */
      background-color: #f8f9fa !important;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05) !important;
      transition: all 0.3s ease-in-out !important;
      color: #2c3e50 !important;
      font-weight: 500 !important;
    }
    .search input:focus {
      border-color: #2c3e50 !important;     /* focus 時轉換為深灰色 */
      box-shadow: 0 0 8px rgba(52,152,219,0.3) !important;
      background-color: #fff !important;
      outline: none;
    }
    .search::after {
      top: 27px !important;
      left: 25px !important;
    }
    .search input::placeholder {
      color: #95a5a6 !important;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div id="app">🚀 正在載入分析數據...</div>
  <script>
    window.$docsify = {
      name: 'GoogleAlertManager',
      repo: 'wenchiehlee-money/GoogleAlertManager',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      homepage: 'README.md',
      auto2top: true,
      formatUpdated: '{MM}/{DD} {HH}:{mm}',
      executeScript: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜尋文章或報告...',
        noData: '找不到符合的文章',
        depth: 6,
        hideOtherSidebarContent: false
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- 全域搜尋外掛 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
