[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-alert-manager"
version = "0.1.0"
description = "Manage Google Alerts, collect notifications, and extract conclusions via LLM"
requires-python = ">=3.11.5"
dependencies = [
    "google-alerts",
    "feedparser",
    "APScheduler>=3.10",
    "click",
    "pyyaml",
    "python-dotenv",
    "jinja2",
    "nltk>=3.10.4",
    "llm",
    "cryptography>=50.0.0",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
    "idna>=3.18",
    "pyasn1>=0.6.5",
    "pygments>=2.20.0",
    "soupsieve>=4.0.0",
    "certifi>=2026.10.18",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
llm = { git = "https://github.com/wenchiehlee/llm.git" }

[project.scripts]
gam = "cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
