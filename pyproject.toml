[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-alert-manager"
version = "0.1.0"
description = "Manage Google Alerts, collect notifications, and extract conclusions via LLM"
requires-python = ">=3.11"
dependencies = [
    "google-alerts",
    "feedparser",
    "APScheduler>=3.10",
    "click",
    "pyyaml",
    "python-dotenv",
    "jinja2",
    "nltk>=3.10.0",
    "llm",
    "cryptography>=49.0.0",
    "requests>=2.34.0",
    "urllib3>=2.7.0",
    "idna>=3.18",
    "pyasn1>=0.6.4",
    "pygments>=2.20.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
llm = { git = "https://github.com/wenchiehlee/llm.git" }

[project.scripts]
gam = "cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
